<style>
.lesson-visuals{margin:26px 0 34px;display:grid;gap:15px}.lesson-visuals .lv-title{padding:24px 27px;border-radius:18px;color:#fff;background:linear-gradient(125deg,#102a43,#14536b)}.lesson-visuals .lv-title small{color:#8be6d9;letter-spacing:.16em;font-weight:800}.lesson-visuals .lv-title h2{color:#fff;margin:5px 0;font-size:24px}.lesson-visuals .lv-title p{color:#d5e7ed;margin:0;font-size:14px}.lesson-visuals .lv-panel{padding:19px;border:1px solid var(--line);border-radius:16px;background:var(--surface,#fff)}.lesson-visuals .lv-panel h3{margin:0 0 14px;font-size:17px}.lesson-visuals .lv-flow{display:flex;gap:9px;overflow-x:auto;padding:2px 0 8px}.lesson-visuals .lv-card{min-width:180px;flex:1;background:var(--brand-soft,#eaf4f5);border-top:4px solid var(--brand,#169a9c);border-radius:10px;padding:13px}.lesson-visuals .lv-card:nth-child(even){border-color:#e0a42c}.lesson-visuals .lv-card b{display:block;font-size:14px}.lesson-visuals .lv-card p{font-size:13px;line-height:1.6;margin:7px 0 0}.lesson-visuals .lv-note{font-size:12px;color:var(--muted);margin:8px 0 0}
</style>
<script>
(function(){
  function escV(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function enrich(){
    const article=document.querySelector('.article');
    if(!article||article.querySelector('.lesson-visuals'))return;
    const header=article.querySelector('.art-head');
    if(!header)return;
    const objectives=[...article.querySelectorAll('.objectives li')].slice(0,5).map((li,i)=>`<div class="lv-card"><b>学习目标 ${i+1}</b><p>${escV(li.textContent.trim())}</p></div>`).join('');
    const firstTable=article.querySelector('.tbl table');
    const headers=firstTable?[...firstTable.querySelectorAll('thead th')].map(x=>x.textContent.trim()):[];
    const comparisons=firstTable?[...firstTable.querySelectorAll('tbody tr')].slice(0,6).map(tr=>{const cells=[...tr.cells].map(x=>x.textContent.trim());return `<div class="lv-card"><b>${escV(cells[0])}</b><p>${escV(cells.slice(1,3).join(' · '))}</p></div>`}).join(''):'';
    if(!objectives&&!comparisons)return;
    const box=document.createElement('section');box.className='lesson-visuals';box.setAttribute('aria-label','本课可视化学习导览');
    box.innerHTML=`<div class="lv-title"><small>VISUAL LEARNING</small><h2>本课知识图解</h2><p>先看结构，再读原理；以下内容提取自本课正文。</p></div>${objectives?`<div class="lv-panel"><h3>学习路线</h3><div class="lv-flow">${objectives}</div></div>`:''}${comparisons?`<div class="lv-panel"><h3>${escV(headers.join(' · ')||'关键对照')}</h3><div class="lv-flow">${comparisons}</div><p class="lv-note">教学图解；具体数值与选型须以官方样本为准。</p></div>`:''}`;
    header.after(box);
  }
  new MutationObserver(enrich).observe(document.getElementById('app'),{childList:true,subtree:true});
  enrich();
})();
</script>
