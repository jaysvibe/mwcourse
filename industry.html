/p>\n<p>这五步里，\"看\"和\"问\"花的时间最多，也最值得。看铭牌、看旧件、看历史订单，能把大部分型号问题解决掉；问停机窗口和决策流程，能把商务风险提前暴露。剩下三步是补充，不是替代。</p>\n<h2 id=\"s6\">六、销售追问：把技术变成订单</h2>\n<p><strong>第一问：这批件是计划检修还是突然坏了？停机窗口从哪天开始？</strong> 计划检修可以等，突然坏了不能等。这一问决定交期优先级，也决定要不要建议替代方案。</p>\n<p><strong>第二问：这几项只有名称，能不能给铭牌照片或者旧件尺寸？</strong> 型号、速比、轴径、安装距，四个数缺一个都可能装不上。这一问也是专业度的体现。</p>\n<p><strong>第三问：有没有可以先恢复运行的临时方案？</strong> 停产件可以用替代型号、测绘件、或者拆机件过渡。先让客户转起来，再谈长周期件，客户会记得。</p>\n<p><strong>第四问：预算区间和决策流程是怎样的？技术确认谁签字？</strong> 预算决定配置档次，流程决定你要找几个人。技术确认人比采购更关键，因为他签字，方案才落地。</p>\n<p><strong>第五问：付款条件和贸易术语按哪个来？</strong> 预付款比例、账期、发货港、风险转移点，每一项都影响价格和现金流，必须在报价前明确。</p>\n<p><strong>第六问：备件要不要按一年用量备一批？</strong> 单次报价是买卖，年度备件包是关系。易损件的年用量、消耗规律、库存责任，都可以谈。</p>\n<p>六问问完，报价单不再是一张价格表，而是一份\"配置 + 交期 + 边界\"的说明。客户拿它去比价，也比得明白。</p>\n<p>还有一个常被忽略的动作：报完价之后主动跟一次。不是催单，是确认三件事——收到没有、配置有没有异议、时间节点要不要调整。这一次跟进，往往能把\"客户还在比价\"变成\"客户在跟你确认细节\"。</p>\n<h2 id=\"s7\">七、常见误判与边界</h2>\n<p><strong>口头承诺交期。</strong> \"一个月应该没问题\"这句话，客户会当成承诺记下来。要么给书面起算条件，要么说\"我确认后回复\"。这不是保守，是负责。</p>\n<p><strong>报价单不写不含项。</strong> 安装、调试、土建、旧件拆除、税费、运费，哪些含、哪些不含，要逐条写。不写，默认就是含，后面每一条都是争议。</p>\n<p><strong>不写有效期。</strong> 材料价格和汇率都在动，报价没有有效期，等于把风险全部留给自己。有效期多长，按公司商务政策定。</p>\n<p><strong>把\"最低价\"当成唯一目标。</strong> 客户说最低价，往往是因为他还没算过停机损失。把停线成本、备件消耗、维修工时摆出来，价格才有比较的维度。</p>\n<p><strong>遇到停产件直接说没有。</strong> 停产不等于没有方案：替代型号、测绘仿制、库存检索、拆机件，都是路径。直接回绝，等于把客户推给同行。</p>\n<p><strong>把所有件打包报一个总价。</strong> 总价看起来省事，客户没法比价，也没法分批采购，最后往往被拆开逐项压价。正确做法是分项报价、分项交期，再给一个打包的商务条件。</p>\n<p>边界在这里：价格审批权在公司，销售不能自行让价；交期以工厂排产确认为准，不能替工厂承诺；替代型号要经过技术确认，不能口头保证\"完全一样\"；质保条款按公司标准，不额外承诺。所有对外承诺，以书面为准。</p>\n<p>还有一条容易被忽略的边界：不要替客户做技术决定。客户说\"就按这个型号订\"，你可以提示风险，但最终选型责任要落在他签字确认的配置单上。这不是推责，是让专业判断各归其位。</p>\n<h2 id=\"s8\">八、本课总结卡</h2>\n<table><thead><tr><th>格</th><th>内容</th></tr></thead><tbody>\n<tr><td>整机角色</td><td>备件按动力、传动、执行、支撑、密封、保护、清扫分类，再定关键度</td></tr>\n<tr><td>核心原理</td><td>报价是一组假设，交期是一条关键路径，条款改变价格</td></tr>\n<tr><td>头号失效</td><td>清单不全就报价，导致追加、比价失败或交付争议</td></tr>\n<tr><td>现场信号</td><td>型号停产、参数缺失、数量\"若干\"、停机窗口紧</td></tr>\n<tr><td>销售话术</td><td>先确认配置和起算点，再谈价格；先给临时方案，再谈长周期件</td></tr>\n<tr><td>边界</td><td>价格归公司审批，交期归工厂排产，替代要技术确认</td></tr>\n</tbody></table>\n<h2 id=\"s9\">九、自测（8 题）</h2>\n<p class=\"quiz-q\"><strong>1.</strong> 客户发来清单只写\"减速机一台\"，最先应该做什么？</p>\n<p>A. 按最小配置报价 B. 索取铭牌照片，确认速比、安装方式、是否带逆止器 C. 报一个区间价 D. 让客户自己选型号 <strong>答案：B。</strong> 配置不清，报价一定产生追加。</p>\n<p class=\"quiz-q\"><strong>2.</strong> 交期承诺最稳妥的写法是什么？</p>\n<p>A. 一个月内到货 B. 尽快 C. 收到预付款并确认图纸后 X 周发货 D. 按同行交期 <strong>答案：C。</strong> 起算点清楚，责任才清楚。</p>\n<p class=\"quiz-q\"><strong>3.</strong> 报价的三个\"锚\"不包括哪一项？</p>\n<p>A. 成本锚 B. 竞品锚 C. 价值锚 D. 汇率锚 <strong>答案：D。</strong> 汇率是影响因素，不是定价参照。</p>\n<p class=\"quiz-q\"><strong>4.</strong> 贸易术语主要影响什么？</p>\n<p>A. 产品颜色 B. 运费、保险、关税和风险转移点 C. 电机功率 D. 质保年限 <strong>答案：B。</strong> 同样的货，术语不同，报价和责任都不同。</p>\n<p class=\"quiz-q\"><strong>5.</strong> 长交期订单最需要防的风险是什么？</p>\n<p>A. 客户改地址 B. 材料价格和汇率波动 C. 包装破损 D. 型号太长 <strong>答案：B。</strong> 三到六个月的交期，成本假设会变。</p>\n<p class=\"quiz-q\"><strong>6.</strong> 客户说\"月底必须到\"，但关键件是铸件，正确做法是什么？</p>\n<p>A. 先答应，再想办法 B. 说明关键路径，给出替代或分批到货方案 C. 直接拒绝 D. 让客户改设计 <strong>答案：B。</strong> 把路径讲清，比空头承诺有用。</p>\n<p class=\"quiz-q\"><strong>7.</strong> 报价单上的\"不含项\"为什么要写？</p>\n<p>A. 显得专业 B. 避免安装、调试、运费等后续争议 C. 可以让价格更低 D. 客户要求的 <strong>答案：B。</strong> 不写就等于默认包含。</p>\n<p class=\"quiz-q\"><strong>8.</strong> 遇到停产型号，最合适的处理方式是什么？</p>\n<p>A. 直接说没有 B. 查替代型号、测绘、库存，给客户可选路径 C. 报一个高价 D. 让客户换设备 <strong>答案：B。</strong> 停产不等于无解，路径要摆出来。</p>\n<h2 id=\"s10\">十、现场作业</h2>\n<p>找一张你手上的真实询价单（或本课的十二项清单），完成三件事：</p>\n<ol><li>按整机角色给每一项分类，标出\"停线关键度\"和\"交期风险\"。</li><li>列出至少五条\"报价前必须确认\"的信息，写成可以直接发给客户的问题。</li><li>起草一段报价说明，包含：配置口径、交期起算点、有效期、三条不含项。</li></ol>\n<p>写完之后自己读一遍，检查三件事：有没有一句话是你不敢写进合同的、有没有一项配置是你没跟客户确认过的、有没有一个日期是你替工厂定的。这三件事，就是这一课真正要防的风险。</p>\n<p>下一课是模块的最后一课：把一年的工单、停机和备件消耗放在一起看，怎么从\"卖件\"走到\"年度合作\"。</p>","toc":[["s1","一、现场场景"],["s2","二、整机角色：这十二项分别管什么"],["s3","三、工作原理：价格和交期各由什么构成"],["s4","四、关键配合与失效链"],["s5","五、现场判断：五步核对"],["s6","六、销售追问：把技术变成订单"],["s7","七、常见误判与边界"],["s8","八、本课总结卡"],["s9","九、自测（8 题）"],["s10","十、现场作业"]]},{"id":30,"title":"客户复盘与大客户：把一年的事讲成一张纸","sub":"这一课解决一个问题：年度复盘会上，怎么用一年的停机和能耗数据，把\"你的价格高 8%\"这句话接住。","body":"<p><strong>行业：</strong> 汽车零部件、电子、食品、医药、通用制造　<strong>建议时长：</strong> 60 分钟　<strong>自测：</strong> 8 题</p>\n<h2 id=\"s1\">一、现场场景</h2>\n<p>客户是一家汽车零部件厂，年度供应商复盘会。会议室里坐着设备部经理、采购主管、动力班组长，还有一位分管生产的副厂长。议题三项：今年空压站的非计划停机、明年的降本目标、供应商份额调整。</p>\n<p>设备部先开口：今年空压站非计划停机六次，最长一次十一个小时，原因是高温跳机；备件换过主机轴承、油气分离器、最小压力阀、干燥机的一个电磁阀。采购接着说：同类备件，你们的价格比另一家高百分之八左右，明年整体要降五个点，否则份额要调整。</p>\n<p>这时候如果只回答\"我们的质量好\"，会议就结束了。正确的做法是把一年的记录摊开：六次停机分别是什么原因、每次停了多久、影响了哪条线、备件消耗的结构是什么、电费单上的比功率是多少、管网有没有做过泄漏检测。这些数据一摆，\"贵百分之八\"就不再是一个孤立的价格问题，而是一个总成本问题。</p>\n<p>复盘不是年终总结，是把过去十二个月的运行事实，变成下一年的合作依据。</p>\n<h2 id=\"s2\">二、整机角色：一座空压站由谁组成</h2>\n<table><thead><tr><th>角色</th><th>典型零件</th><th>负责什么</th><th>坏了会拖谁下水</th></tr></thead><tbody>\n<tr><td>压缩主机</td><td>转子、轴承、轴封、进气阀</td><td>把空气压缩到设定压力</td><td>主机磨损后排气量下降，全厂压力不足</td></tr>\n<tr><td>驱动调速</td><td>电机、变频器、联轴器</td><td>提供转速，按需调节气量</td><td>变频器故障切工频，加卸载频繁，能耗上升</td></tr>\n<tr><td>冷却</td><td>后冷却器、油冷却器、风扇、冷却水泵</td><td>把压缩热带走</td><td>冷却失效直接高温跳机，油品加速劣化</td></tr>\n<tr><td>净化干燥</td><td>干燥机、过滤器、油气分离器</td><td>除水、除油、除尘</td><td>露点升高，管网积水，下游气动件锈蚀</td></tr>\n<tr><td>储存</td><td>储气罐、安全阀、排水器</td><td>稳定压力、缓冲用气波动</td><td>容量不足，空压机频繁加卸载</td></tr>\n<tr><td>控制联锁</td><td>压力开关、联控柜、温度传感器</td><td>决定加卸载和轮换</td><td>设定不当，多台机同时加载或频繁启停</td></tr>\n<tr><td>管网</td><td>主管、支管、接头、用气点</td><td>把气送到设备</td><td>泄漏和压降，让空压机白做功</td></tr>\n</tbody></table>\n<p>一座空压站看起来是一台机器，实际是一条从电到气的完整链条。复盘的价值，就在于看清楚损失发生在哪一段：是主机效率、冷却能力、净化效果，还是管网漏掉了。</p>\n<h2 id=\"s3\">三、工作原理：电是怎么变成气的，损失又在哪</h2>\n<p>路径是：电 → 电机 → 主机转子 → 压缩空气 → 后冷却器 → 储气罐 → 干燥机与过滤器 → 管网 → 用气点。这条链上，每一段都有损失，而损失最终都体现在电费上。</p>\n<p><strong>比功率是空压站的核心指标。</strong> 它指的是一定额定排气量消耗多少功率，单位常用千瓦每立方米每分钟。这个数把\"压力、气量、效率\"合在一起，是不同机器之间唯一公平的比较口径。客户说\"这台机器便宜\"，你可以问\"它的比功率是多少\"，一句话就把话题从采购价拉到运行成本。</p>\n<p><strong>电费占生命周期成本的大头。</strong> 一台空压机运行几年下来，电费通常远高于采购价，具体倍数随电价、负载率、运行小时变化，要按项目核算。这也是为什么\"降本五个点\"如果只压备件价格，效果有限；把比功率降下来、把泄漏堵住，省下的电费可能超过备件降价的全部金额。</p>\n<p><strong>加卸载和变频是两种调节方式。</strong> 用气量波动时，工频机靠加卸载维持压力，卸载时电机仍在空转，这部分能量是白花的；变频机通过降转速匹配气量，部分负载下效率更好。但变频不是万能的：用气量长期接近满负荷时，变频的节流损失和变频器损耗会抵消优势。选哪种，要看负载曲线，不是看宣传。</p>\n<p><strong>压降是被忽略的成本。</strong> 从空压机出口到用气点，压力沿途会下降。过滤器堵塞、管路太小、弯头太多、接头漏气，都会加大压降。为了保住末端压力，只能把空压机设定压力调高，而压力每提高一点，能耗就跟着上升。所以\"末端压力不够\"这件事，先查压降，再考虑加机。</p>\n<p><strong>泄漏是最大的隐性浪费。</strong> 管网接头、软管、快换接头、排水器、老化密封，都会漏气。泄漏率在管理粗放的工厂里可以很高，具体数值要靠关阀测试或超声波检测确认。泄漏的特点是：不产生次品、不触发报警、不影响当天产量，所以没人管；但它让空压机全年多跑，电费一直付。</p>\n<p><strong>露点决定下游的命运。</strong> 干燥机把压缩空气里的水降到一定露点，露点不够低，水就在管网里析出。水顺着管道流到用气点，气动阀锈蚀、气缸动作迟滞、冬季冻堵，最后表现为\"设备不稳定\"，而没人想到是压缩空气的问题。</p>\n<p><strong>热回收是一个可选项。</strong> 压缩过程产生的热，大部分通过冷却器排掉。有条件时可以回收用于生活热水或工艺预热，回收率取决于现场需求和管路条件，要按项目评估，不能一概而论。</p>\n<p><strong>多机联控决定谁先跑。</strong> 空压站通常不止一台机器，几台机器怎么轮换、谁做主谁做备、加载顺序怎么排，直接影响总能耗和单机寿命。常见的问题是：一台机器长期满负荷、另一台长期闲置，满负荷那台先坏，而闲置那台也没起到备用作用。联控柜的设定、轮换周期、备用机的切换逻辑，都值得在复盘时问一句。</p>\n<p><strong>冷却水温是被低估的变量。</strong> 水冷机组的排气温度，最终受冷却水温制约。夏季冷却塔效率下降、水温升高，机器即使本身没问题，也会因为散热条件变差而高温。所以\"夏天容易跳机\"这件事，要同时看机器和冷却系统，不能只盯主机。</p>\n<h2 id=\"s4\">四、关键配合与失效链</h2>\n<p><strong>链一：进气过滤堵塞 → 高温 → 油劣化 → 主机损伤。</strong> 进气过滤器长期不换或环境粉尘大 → 进气阻力上升 → 压缩比升高、排气温度上升 → 润滑油氧化、积碳 → 油气分离器压差增大 → 油耗上升、分离效果变差 → 主机轴承润滑不足 → 轴承磨损、转子抱死。 症状是排气温度高、分离器压差大、油耗上升。容易被误判成\"油品不好\"，于是换油品牌，但过滤器和环境没变，几个月后重复。</p>\n<p><strong>链二：冷却能力下降 → 高温跳机 → 生产压力不足。</strong> 冷却水结垢、冷却器翅片堵塞、风扇皮带松、冷却水温高 → 排气温度持续上升 → 达到保护值跳机 → 储气罐压力下降 → 下游用气点压力不足 → 设备停机或产品不合格。 症状是夏季高发、跳机前有高温报警。容易被误判成\"机器老了\"，实际是冷却侧维护缺失。判断方法：测冷却器进出口温差、看翅片是否糊死、查冷却水水质。</p>\n<p><strong>链三：干燥失效 → 露点升高 → 管网积水 → 气动件失效。</strong> 干燥机吸附剂饱和或冷媒不足、排水器堵塞、过滤器失效 → 露点升高 → 管网析水 → 气动阀锈蚀、气缸动作迟滞 → 冬季冻堵 → 执行机构误动作 → 产品报废或设备停机。 症状是管网末端放水多、气动件更换频繁。容易被误判成\"气动件质量差\"，实际是气源品质问题。</p>\n<p>三条链的共同点：它们的代价都不体现在备件发票上，而体现在电费、停机和次品里。复盘要做的，就是把这些代价算出来。</p>\n<h2 id=\"s5\">五、现场判断：五步复盘</h2>\n<p><strong>看。</strong> 一年的工单记录、报警历史、备件领用台账、电费单、运行日志。看的时候不要只看总数，要按月份排开，看停机是不是集中在夏季、是不是集中在某个班次。</p>\n<p><strong>摸。</strong> 到空压站现场摸冷却器进出口管路温度、摸储气罐排水器、摸过滤器压差表。手感不能代替仪表，但能快速发现异常。</p>\n<p><strong>听。</strong> 听加卸载的频率、听管路有没有漏气的嘶嘶声、听主机有没有异常敲击。夜间停产时是听泄漏最好的时候，环境噪声低。</p>\n<p><strong>测。</strong> 比功率、排气压力与末端压力之差、压降、露点、泄漏率（关阀测试或超声波）、冷却水温差。这些数据是复盘会的硬通货。</p>\n<p><strong>问。</strong> 问班组长：今年哪次停机最影响生产、当时怎么处理的、备用机有没有启用、明年产量计划有没有变化。班组长记得的细节，往往比台账真实。</p>\n<p>五步走完，你手里应该有一张\"停机原因—时长—影响—处理\"的表，和一张\"能耗—压降—泄漏\"的表。两张表放在一起，复盘会才有内容。</p>\n<p>还有一点常被忽略：复盘的数据来源要写清楚。哪些是客户台账、哪些是仪表读数、哪些是访谈回忆，分别标注。访谈回忆可以用，但不能当唯一依据；客户自己也会在会议上质疑\"这个数不对\"，提前标好来源，就少一次争执。</p>\n<h2 id=\"s6\">六、销售追问：把技术变成订单</h2>\n<p><strong>第一问：今年六次停机，原因分别是什么，各停了多少小时？</strong> 先让客户自己把原因分类。分类的过程，就是他从\"机器不行\"走向\"某一段不行\"的过程。</p>\n<p><strong>第二问：这六次里，有几次是因为高温，几次是因为气源品质？</strong> 把停机归到具体链条上。高温对应冷却和过滤，气源品质对应干燥和过滤，两条链的解决方案完全不同。</p>\n<p><strong>第三问：电费单上的比功率是多少，和铭牌差多少？</strong> 这一问把话题从备件价格拉到运行成本。差得越多，改造或更换的理由越充分。</p>\n<p><strong>第四问：管网做过泄漏检测吗？末端压力和出口压力差多少？</strong> 泄漏和压降是投入产出比最高的改善项，往往不需要换主机。</p>\n<p><strong>第五问：明年的产量计划和用气曲线有没有变化？</strong> 复盘是往前看的。产量上升、班次调整、新增用气设备，都会改变选型和配置。</p>\n<p><strong>第六问：明年的预算什么时候定，供应商准入和份额评估谁主导？</strong> 这一问是商务节奏。复盘会开完再问，就晚了半年。</p>\n<p>大客户的决策不是一个人做的。复盘会上出现的四个人，关心的东西完全不同：</p>\n<table><thead><tr><th>角色</th><th>关心什么</th><th>能影响什么</th><th>常见异议</th></tr></thead><tbody>\n<tr><td>设备部</td><td>停机、维修工作量、备件可得性</td><td>技术方案、品牌指定</td><td>换品牌怕不稳定</td></tr>\n<tr><td>采购</td><td>单价、账期、份额</td><td>商务条款、比价</td><td>别家便宜八个点</td></tr>\n<tr><td>生产</td><td>产量、气压稳定性、次品率</td><td>停机容忍度、改造窗口</td><td>不能停线</td></tr>\n<tr><td>财务</td><td>现金流、资产折旧、总成本</td><td>预算、付款方式</td><td>一次性投入太大</td></tr>\n</tbody></table>\n<p>销售如果只跟采购谈，永远在谈单价；只跟设备谈，方案好但预算过不了。复盘会是一个把四方拉到同一张桌子前的机会，你要准备的，是让每个人都能听懂的那一页纸。</p>\n<p>大客户还有一道门槛：供应商准入。很多工厂有合格供应商名录、年度审核、新品试用流程，进入名录需要样品测试、小批量试用、质量协议签署。这些流程走完可能要几个月，销售如果等到有订单才启动，交期再短也没用。反过来，提前把准入做掉，下一次询价时你才在名单里。</p>\n<h2 id=\"s7\">七、常见误判与边界</h2>\n<p><strong>把复盘开成产品推销会。</strong> 客户要的是\"明年怎么少停几次\"，你讲的是\"我们出了新品\"。复盘的前三分之二时间应该用来确认事实和原因，最后三分之一才谈方案。</p>\n<p><strong>只谈单价，不谈总成本。</strong> 单价高百分之八，如果能让停机少两次、电费降一点，总成本可能是低的。但这句话要用客户自己的数据算，不能用行业平均值套。</p>\n<p><strong>承诺节能百分比。</strong> 节能率取决于负载曲线、运行小时、电价、现有设备状态，任何一个变量变了，结果都不一样。可以承诺测试方法和验收口径，不能承诺一个拍脑袋的百分比。</p>\n<p><strong>越级接触。</strong> 绕过设备部直接找副厂长，短期可能推动，长期会让设备部在后续维护中不配合。大客户经营是多方下注，不是单点突破。</p>\n<p><strong>数据不签字。</strong> 复盘用的停机时长、电费、产量，要让客户确认。数据来源不清，算出来的结论客户不认，反而伤信任。</p>\n<p><strong>把复盘当成一次性汇报。</strong> 复盘不是年底交一份 PPT 就结束。数据要留档，明年同期用同一套口径对比，才能看出改善有没有落地。没有可比口径的复盘，只是讲故事。</p>\n<p>边界在这里：能耗测算需要仪表实测，不能用铭牌推算；改造方案要经过现场勘查和技术评审；商务条款按公司政策，销售不自行承诺份额和价格；客户的组织关系和预算周期，要靠日常拜访积累，不能靠一次会议打探。</p>\n<p>大客户的经营，落到具体动作上是三件事：一是把年度复盘做成固定动作，每季度一次小复盘、每年一次大复盘；二是把备件从\"现采\"变成\"框架 + 安全库存\"，把交期风险前移；三是把改善项目做成共同投资，客户出场地和数据，你出方案和设备，成果共享。这三件事做成了，价格就不再是唯一的比较维度。</p>\n<h2 id=\"s8\">八、本课总结卡</h2>\n<table><thead><tr><th>格</th><th>内容</th></tr></thead><tbody>\n<tr><td>整机角色</td><td>主机、驱动、冷却、净化、储存、控制、管网，七段共同决定气够不够、干不干</td></tr>\n<tr><td>核心原理</td><td>电变气，损失全在电费里；比功率、压降、泄漏是三个抓手</td></tr>\n<tr><td>头号失效</td><td>冷却和过滤失效引起高温停机，干燥失效引起气源品质问题</td></tr>\n<tr><td>现场信号</td><td>夏季高发跳机、分离器压差大、末端放水多、加卸载频繁</td></tr>\n<tr><td>销售话术</td><td>用客户自己的停机时长和电费说话，再谈价格</td></tr>\n<tr><td>边界</td><td>节能率要实测，改造要评审，份额和价格按公司政策</td></tr>\n</tbody></table>\n<h2 id=\"s9\">九、自测（8 题）</h2>\n<p class=\"quiz-q\"><strong>1.</strong> 空压站复盘会上，客户说\"你们贵百分之八\"，最好的回应是什么？</p>\n<p>A. 强调质量好 B. 用停机时长、电费、备件消耗算总成本 C. 直接降价 D. 说别家更贵 <strong>答案：B。</strong> 把单点价格变成总成本比较，才有讨论空间。</p>\n<p class=\"quiz-q\"><strong>2.</strong> 比功率反映的是什么？</p>\n<p>A. 机器重量 B. 单位排气量消耗的功率 C. 储气罐容积 D. 管网长度 <strong>答案：B。</strong> 它是跨机型比较效率的统一口径。</p>\n<p class=\"quiz-q\"><strong>3.</strong> 空压机排气温度高，最常见的上游原因是什么？</p>\n<p>A. 进气过滤器堵塞、冷却能力下降 B. 储气罐太小 C. 管网太长 D. 用气点太多 <strong>答案：A。</strong> 进气阻力和冷却效果直接决定排气温度。</p>\n<p class=\"quiz-q\"><strong>4.</strong> 末端压力不足，最先应该查什么？</p>\n<p>A. 换更大的空压机 B. 管网压降和泄漏 C. 换干燥机 D. 加储气罐 <strong>答案：B。</strong> 压降和泄漏常常是主因，加机是最后手段。</p>\n<p class=\"quiz-q\"><strong>5.</strong> 管网泄漏为什么长期没人管？</p>\n<p>A. 不影响产量、不触发报警 B. 修起来太便宜 C. 检测太简单 D. 客户都知道 <strong>答案：A。</strong> 隐性浪费最容易被忽略。</p>\n<p class=\"quiz-q\"><strong>6.</strong> 干燥机失效会带来什么后果？</p>\n<p>A. 排气压力升高 B. 露点升高，管网积水，气动件锈蚀 C. 电机过热 D. 油耗下降 <strong>答案：B。</strong> 气源品质问题会向下游传导。</p>\n<p class=\"quiz-q\"><strong>7.</strong> 大客户经营中，只跟采购谈的最大问题是什么？</p>\n<p>A. 采购不懂技术 B. 永远在谈单价，方案推不动 C. 采购没预算 D. 采购不签字 <strong>答案：B。</strong> 设备、生产、财务的诉求没有进入对话。</p>\n<p class=\"quiz-q\"><strong>8.</strong> 复盘时承诺节能百分比，风险在哪？</p>\n<p>A. 客户不信 B. 节能率取决于负载、工时、电价等多个变量 C. 节能不重要 D. 没有风险 <strong>答案：B。</strong> 变量太多，承诺数字容易兑现不了。</p>\n<h2 id=\"s10\">十、现场作业</h2>\n<p>选一个你负责的客户，做一份一页纸的年度复盘：</p>\n<ol><li>列出今年所有非计划停机：时间、时长、原因、影响的产品线。</li><li>按\"主机、驱动、冷却、净化、储存、控制、管网\"七段，把原因归类，找出出现最多的两段。</li><li>算一笔账：停机损失、备件消耗、电费，三项各占多少（数据由客户提供，缺的标\"待补\"）。</li><li>写三条明年的改善建议，每条注明\"需要客户提供什么数据、需要谁签字\"。</li></ol>\n<p>这份一页纸，就是下一次复盘会的底稿。三十课到这里结束，但工作方法没有结束：每一台机器都可以拆成角色、链条和信号，每一个客户都可以拆成工况、成本和决策人。</p>","toc":[["s1","一、现场场景"],["s2","二、整机角色：一座空压站由谁组成"],["s3","三、工作原理：电是怎么变成气的，损失又在哪"],["s4","四、关键配合与失效链"],["s5","五、现场判断：五步复盘"],["s6","六、销售追问：把技术变成订单"],["s7","七、常见误判与边界"],["s8","八、本课总结卡"],["s9","九、自测（8 题）"],["s10","十、现场作业"]]}]};</script>
<script>
(function(){
  const D = window.COURSE_DATA;
  const byId = new Map(D.lessons.map(x=>[x.id,x]));
  const $ = (s)=>document.querySelector(s);
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function modOf(id){return D.modules.find(m=>m.lessons.includes(id));}
  function sidebarLesson(L){
    let h = '<a class="back" href="#/">← 返回课程表</a><div class="t">本课目录</div>';
    h += L.toc.map(([sid,t])=>`<a href="#${sid}">${esc(t)}</a>`).join('');
    return h;
  }
  function sidebarHome(){
    return '<div class="t">课程表</div>' + D.modules.map(m=>`<a href="#m-${m.id}">${m.id} ${esc(m.name)}</a>`).join('');
  }
  function home(){
    $('.aside').innerHTML = sidebarHome();
    let mods = D.modules.map(m=>{
      let ls = m.lessons.map(id=>{const L=byId.get(id);return L?`<a href="#/lesson/${id}">第${id}课　${esc(L.title)}</a>`:''}).join('');
      return `<div class="mod" id="m-${m.id}"><h3>${m.id}　${esc(m.name)}</h3><div class="n">${m.lessons[0]}–${m.lessons[m.lessons.length-1]} 课</div>${ls}</div>`;
    }).join('');
    $('.main').innerHTML = `<div class="hero"><div class="badge">MW 全才销售课</div>
      <h1>30 课，按行业看懂机械</h1>
      <p>每一课围绕一台真实机器：它由哪些部件组成、怎么配合、哪里先坏、销售到现场怎么问。60 分钟密度，讲原理和机制，不堆公式。</p>
      <a class="btn" href="#/lesson/1">开始第 1 课 · 泵站</a></div>
      <div class="mods">${mods}</div>`;
    $('.top .badge').textContent = D.lessons.length + ' 课';
  }
  function visualDeck(L){
    const source = new DOMParser().parseFromString(L.body, 'text/html');
    const roleTable = source.querySelector('table');
    const rows = roleTable ? [...roleTable.querySelectorAll('tbody tr')].slice(0,7).map(tr=>[...tr.cells].map(td=>td.textContent.trim())) : [];
    const steps = rows.map((r,i)=>`<div class="viz-step"><span class="viz-index">${i+1}</span><b>${esc(r[0]||'环节')}</b><small>${esc(r[1]||'')}</small><p>${esc(r[2]||'')}</p></div>`).join('');
    const signals = rows.filter(r=>r[3]).slice(0,5).map(r=>`<div class="viz-signal"><b>${esc(r[0])}</b><span>${esc(r[3])}</span></div>`).join('');
    const sections = L.toc.filter(([sid])=>/^s[1-7]$/.test(sid)).map(([sid,t],i)=>`<a href="#${sid}" class="viz-route-item"><i>${String(i+1).padStart(2,'0')}</i><span>${esc(t.replace(/^[一二三四五六七八九十]+、/,''))}</span></a>`).join('');
    const sectionText = sid => {const h=source.getElementById(sid);const out=[];for(let n=h&&h.nextElementSibling;n&&n.tagName!=='H2'&&out.length<5;n=n.nextElementSibling){if(n.tagName==='P'&&n.textContent.trim().length>70)out.push(n.textContent.trim());}return out;};
    const principles=sectionText('s3').slice(0,4).map((p,i)=>{const first=p.split(/[。；]/)[0].slice(0,76);return `<details class="viz-principle"><summary><span>${String(i+1).padStart(2,'0')}</span>${esc(first)}</summary><p>${esc(p)}</p></details>`}).join('');
    const check=sectionText('s5').slice(0,4).map((p,i)=>`<div class="viz-check"><strong>现场检查 ${i+1}</strong><p>${esc(p.slice(0,180))}${p.length>180?'…':''}</p></div>`).join('');
    const diagram=rows.length?`<svg viewBox="0 0 800 130" role="img" aria-label="${esc(L.title)}系统部件关系示意" class="viz-svg"><path d="M45 65 H755" stroke="#9dc5cb" stroke-width="3" stroke-dasharray="7 5"/>${rows.slice(0,6).map((r,i)=>{const x=65+i*132;return `<circle cx="${x}" cy="65" r="24" fill="${i%2?'#f1b84b':'#31a8a9'}"/><text x="${x}" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#102c3e">${i+1}</text><text x="${x}" y="113" text-anchor="middle" font-size="13" fill="#2b4a5a">${esc((r[0]||'').slice(0,8))}</text>`}).join('')}</svg>`:'';
    return `<section class="visual-deck" aria-label="本课可视化导览"><div class="viz-heading"><span>VISUAL LEARNING</span><h2>一眼看懂本课</h2><p>下方图解提取自本课正文；用于建立关系，不代替现场数据与工程校核。</p></div><div class="viz-panel"><h3>知识路线图</h3><div class="viz-route">${sections}</div></div>${steps?`<div class="viz-panel"><h3>整机结构 · 部件如何配合</h3>${diagram}<div class="viz-steps">${steps}</div></div>`:''}${principles?`<div class="viz-panel"><h3>原理拆解 · 点击展开</h3><div class="viz-principles">${principles}</div></div>`:''}${signals?`<div class="viz-panel"><h3>失效信号 · 从症状回溯</h3><div class="viz-signals">${signals}</div></div>`:''}${check?`<div class="viz-panel"><h3>现场判断 · 核对清单</h3><div class="viz-checks">${check}</div></div>`:''}</section>`;
  }
  function lesson(id){
    const L = byId.get(id);
    if(!L){ location.hash='#/'; return; }
    const m = modOf(id);
    $('.aside').innerHTML = sidebarLesson(L);
    $('.main').innerHTML = `<div class="meta"><span>第 ${id} 课</span><span>${m?esc(m.name):''}</span><span>建议 60 分钟</span><span>自测 + 作业</span></div>
      <h1>${esc(L.title)}</h1><p class="sub">${esc(L.sub||'')}</p>${visualDeck(L)}<article class="art">${L.body}</article>`;
    $('.top .badge').textContent = (m?m.name:'') + ' · 第 ' + id + ' 课';
    window.scrollTo({top:0,behavior:'instant'});
  }
  function route(){
    const m = location.hash.match(/#\/lesson\/(\d+)/);
    if(m) lesson(parseInt(m[1],10)); else home();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body></html>
